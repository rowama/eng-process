# eng-run runner configuration (project-owned; eng-init creates it once and never overwrites it).
# Role -> runner. Env override per role: ENG_RUNNER_PLAN_REVIEW, ENG_RUNNER_IMPLEMENT, ENG_RUNNER_CODE_REVIEW.
# Built-in runners: claude, codex. Add any other tool as a [runners.<name>] table with type = "command".
# PATH: eng-run finds runners with the PATH of the process that starts it (bot shell, routine, hook), which is
# often non-interactive, so npm installs under nvm (codex, claude) in "$NVM_DIR/versions/node/<version>/bin" are
# missing. If the executable is not on PATH, eng-run looks in $NVM_DIR/versions/node/*/bin and
# ~/.nvm/versions/node/*/bin, prepends every bin dir that has it (newest node version first) and retries; PATH is
# untouched when the executable is already found. Still not found => exit 127.
# Env for the runner process: optional [env] (all runners) and [runners.<name>.env] (that runner), key = "value".
# Other keys override the inherited env (runner table wins). PATH is never replaced: each PATH value is prepended
# (runner PATH, then [env] PATH, then the inherited PATH; ~ expanded; no $VAR expansion) and is also used to find
# the executable. Example (uncomment; no inline { } tables):
# [env]
# PATH = "~/.nvm/versions/node/v22.11.0/bin"
# [runners.codex.env]
# CODEX_HOME = "~/.codex"   # non-PATH values are used as written (no ~ expansion)
[roles]
implement = "claude"
plan-review = "codex"
code-review = "codex"

[hooks]
# Empty by default => bots must stay attached to eng-run until exit (eng-run and eng-check warn).
# Non-empty = fire-and-forget allowed for that role (also set a timeout routine; PROCESS.md §10 / L-006).
# Shell command from the repo root after EVERY eng-run exit (ok and failed), once the run log is written.
# Keys (role-specific wins, else general on_complete, else nothing):
#   implement_on_complete / plan_review_on_complete / code_review_on_complete  - that role only
#   on_complete                                                                - any role without its own key
# Env: ENG_ROLE ENG_EXIT_CODE ENG_STATUS (ok|fail) ENG_RUN_LOG ENG_REPO ENG_PLAN ENG_SLICE
# ENG_HANDOFF (latest handoff from PROJECT_STATE, if any) ENG_PID (runner child pid) ENG_ENG_RUN_PID.
# While a run is in progress eng-run keeps thoughts/shared/runs/<stem>.running.md (pid, role, run_log);
# it is deleted on finish, so "marker present + pid dead" = runner died without a run log.
# Hook failure only warns; eng-run keeps the runner exit code. --dry-run prints it, does not run it.
# Example: wake the planner (Grok Bot routine webhook) so it resumes from the latest handoff:
# implement_on_complete = 'curl -fsS -m 20 -X POST --data-urlencode "repo=$ENG_REPO" --data-urlencode "slice=$ENG_SLICE" --data-urlencode "status=$ENG_STATUS" --data-urlencode "run_log=$ENG_RUN_LOG" --data-urlencode "handoff=$ENG_HANDOFF" https://YOUR-ROUTINE-WEBHOOK-URL'
implement_on_complete = ""
# on_complete = ""          # wake the starter for plan-review / code-review too

[review]
base = "main"            # default --base for code-review <slice-id>

# Built-in adapters accept extra options, e.g.:
# [runners.claude]
# args = ["--model", "opus"]                       # appended to every claude call
# Role implement built-in default: ["--permission-mode", "bypassPermissions"] (headless needs non-interactive approval).
# Note: acceptEdits alone does NOT auto-approve pytest or `python3 .eng/bin/*` (only file edits + limited
# filesystem Bash), so a headless implement stalls at eng-check. Override only if you accept that:
# implement_args = ["--permission-mode", "acceptEdits"]                      # back to acceptEdits (not headless-safe)
# implement_args = ["--permission-mode", "acceptEdits", "--allowedTools", "Bash(pytest:*),Bash(python3 .eng/bin/*)"]  # tighter
# [runners.codex]
# args = ["--model", "gpt-5-codex"]
# implement_args = ["--sandbox", "workspace-write"]   # default: writes only inside the repo, no network
# implement_args = ["--approve-for-me"]                 # opt in: auto-approved on-request escalations
# implement_args = ["--full-auto"]                      # opt in (older codex CLIs)
# plan_review_args = ["--sandbox", "read-only"]         # default for plan-review
# review_prompt = false    # true: send the prompt template to 'codex review' instead of --base (they conflict)
#
# Generic command runner (config-only new tool). Placeholders, substituted per argument (paths with spaces are safe):
#   {prompt} {prompt_file} {output_file} {repo} {role} {target} {base} {plan} {slice}
# The tool's stdout is captured; if it writes {output_file}, that file is used as the result.
# [runners.gemini]
# type = "command"
# command = "gemini -p {prompt}"
# prompt_via = "arg"       # arg | stdin (stdin: the prompt is piped in)
